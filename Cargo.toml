[workspace]
resolver = "2"
members = ["crates/core", "crates/capture", "crates/fake-tools", "crates/dev", "crates/platform", "crates/tools", "crates/clients", "crates/engine", "crates/ctl"]

[workspace.package]
edition = "2021"
version = "0.0.0"
publish = false

[workspace.dependencies]
md-5 = "0.10"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
# preserve_order: serde_json::Map keeps insertion order, as a Python dict does (json.dumps writes it in that order).
# float_roundtrip: every float parses to the exact f64 Python's repr wrote.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = "1"
fancy-regex = "0.14"
unicode-normalization = "0.1"
# The Windows API declarations, used by lazymkv-platform only and pinned exactly (design parts 4.3, 4.5, 4.7; P33).
windows-sys = "=0.61.2"

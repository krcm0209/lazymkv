[package]
name = "lazymkv-platform"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
# The in-memory fakes of design part 4.2 (platform::fakes), for the tests of the crates above this one. Enabled only
# as a dev-dependency or through lazymkv-engine's testkit feature.
fakes = []

[dependencies]
lazymkv-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
# Every Win32 call of platform::win (design parts 4.2, 4.3); the features are the API areas design part 4.3 names.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_WindowsAndMessaging",
] }

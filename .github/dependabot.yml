# Dependabot version updates: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Crate dependencies in Cargo.toml / Cargo.lock (the workspace root).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  # The toolchain channel pinned in rust-toolchain.toml.
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "weekly"

name: CI

# Every push to main and every pull request builds and tests the workspace on Linux, macOS and Windows with the
# toolchain rust-toolchain.toml pins. The private evidence repository is not cloned here, so the tests that need it
# print their "skipped: ..." reason and the rest run; docs/phase2/engine.md has the count. Among them, the stand-in
# tools of crates/fake-tools run a whole engine job, from a disc's arrival to a filed placeholder file, on every
# system (design part 12.6, item 2), and on Windows the platform's Windows implementations run too: the named pipe,
# the mutex, the Job Object runner, Credential Manager under a test name, and a native whole job through the real
# pipe (design parts 12.4 and 12.6, item 3). Tests that need the drive, the share or the owner's desktop session are
# ignored here and run on the mini PC.
#
# Layer 2 (design part 12.1, G1): every runner installs MKVToolNix and an FFmpeg of 7.0 or later (K11), each pinned
# (P33, call 20). Ubuntu takes MKVToolNix from apt at its pinned version and a static FFmpeg 7.x build whose SHA-256
# (Secure Hash Algorithm 256) digest is checked before anything in it runs, since apt's FFmpeg is 6.1; macOS takes
# both from Homebrew and checks mkvmerge's version against the pin; Windows takes FFmpeg from Chocolatey and
# MKVToolNix by its installer, checked against its SHA-256. Each job hands the three programs to the tests as
# LAZYMKV_TEST_MKVMERGE, LAZYMKV_TEST_FFPROBE and LAZYMKV_TEST_FFMPEG; the layer 2 tests
# (crates/fake-tools/tests/layer2.rs) and the ffprobe size cross-check fail here, instead of skipping, when one is
# missing or too old (T5-R49, call 24).
#
# The OCR (optical character recognition) models: the models job restores them from the cache keyed by their
# SHA-256 pins, and on a miss downloads them once through lazymkv-ocr-models' build script; the three test jobs only
# restore that cache (calls 2 and 3). lazymkv-ocr (rten and ocrs) builds, and its worker runs over a made-up
# Matroska file, on ubuntu only, with the ocr-trial feature's build and test: the run's one rten build (F1, call 23;
# T5-R27). macOS and Windows build and test the rest of the workspace. The notices job regenerates the crate
# notices with cargo-about and fails when they differ from crates/ctl/crate-notices.txt (E1, call 26).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The two OCR models' SHA-256 pins (A3), the values of crates/ocr-models/src/pins.rs (its test
  # the_ci_model_cache_is_keyed_by_both_sha256_pins checks both); they key the model cache.
  OCRS_DETECTION_SHA256: a917b23dbd9524b465df7e922641b3ff2981623df4ded5a0234004ef2fee7cfe
  OCRS_RECOGNITION_SHA256: 86c145c2edb96c8caed5b1ebb8f44d706408922211451c309c625157dd6061c5

jobs:
  models:
    # The OCR models for lazymkv-ocr-models' build script (design part 10.11, calls 2 and 3): restored from the cache
    # keyed by their SHA-256 pins, and on a miss downloaded once by the build script and saved, so a run downloads at
    # most once and the three test jobs only restore.
    name: OCR models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore the OCR models
        id: models
        uses: actions/cache/restore@v4
        with:
          path: .ocrs-models
          key: ocrs-models-${{ env.OCRS_DETECTION_SHA256 }}-${{ env.OCRS_RECOGNITION_SHA256 }}
          enableCrossOsArchive: true

      - name: Install the pinned toolchain
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install
          cargo --version

      - name: Download the OCR models through the build script
        if: steps.models.outputs.cache-hit != 'true'
        run: cargo build -p lazymkv-ocr-models --locked

      - name: Copy the OCR models into the cache folder
        if: steps.models.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ocrs-models
          for name in text-detection.onnx text-recognition.onnx; do
            found="$(find target/debug/build -path "*/lazymkv-ocr-models-*/out/$name")"
            test -n "$found"
            test "$(printf '%s\n' "$found" | wc -l)" -eq 1
            cp "$found" .ocrs-models/
          done
          printf '%s  %s\n' "$OCRS_DETECTION_SHA256" .ocrs-models/text-detection.onnx \
            "$OCRS_RECOGNITION_SHA256" .ocrs-models/text-recognition.onnx | sha256sum -c -

      - name: Save the OCR models
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ocrs-models
          key: ocrs-models-${{ env.OCRS_DETECTION_SHA256 }}-${{ env.OCRS_RECOGNITION_SHA256 }}
          enableCrossOsArchive: true

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: models
    env:
      LAZYMKV_OCRS_MODELS: ${{ github.workspace }}/.ocrs-models
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Restore the OCR models
        uses: actions/cache/restore@v4
        with:
          path: .ocrs-models
          key: ocrs-models-${{ env.OCRS_DETECTION_SHA256 }}-${{ env.OCRS_RECOGNITION_SHA256 }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version

      # Layer 2 (design part 12.1, call 20): apt's FFmpeg is 6.1, below K11's 7.0, so ubuntu takes the pinned static
      # 7.x build, checked before anything in it runs, and MKVToolNix from apt at the pinned version (T5-R28).
      - name: Install FFmpeg 7.x and MKVToolNix (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-07-31-14-10/ffmpeg-n7.1.5-12-g1fdbca85aa-linux64-gpl-7.1.tar.xz
          FFMPEG_SHA256: c1e6caf48923dd8e6bc5e54d51ba70c321175b8162ae9c414c392990e72f0e79
          MKVTOOLNIX_VERSION: 82.0-1build2
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/ffmpeg.tar.xz" "$FFMPEG_URL"
          printf '%s  %s\n' "$FFMPEG_SHA256" "$RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          test -x "$RUNNER_TEMP/ffmpeg/bin/ffmpeg"
          test -x "$RUNNER_TEMP/ffmpeg/bin/ffprobe"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "mkvtoolnix=$MKVTOOLNIX_VERSION"
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
          {
            echo "LAZYMKV_TEST_MKVMERGE=$(command -v mkvmerge)"
            echo "LAZYMKV_TEST_FFPROBE=$RUNNER_TEMP/ffmpeg/bin/ffprobe"
            echo "LAZYMKV_TEST_FFMPEG=$RUNNER_TEMP/ffmpeg/bin/ffmpeg"
          } >> "$GITHUB_ENV"
          "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" -version | sed -n 1p
          "$RUNNER_TEMP/ffmpeg/bin/ffprobe" -version | sed -n 1p
          mkvmerge --version

      # Homebrew's FFmpeg is above 7.0; its MKVToolNix must be the pinned version, so a formula that moved on fails
      # here and goes to the owner for a new pin (P33, T5-R28).
      - name: Install FFmpeg and MKVToolNix (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MKVTOOLNIX_VERSION: "103.0"
        run: |
          set -euo pipefail
          brew install ffmpeg mkvtoolnix
          prefix="$(brew --prefix)"
          first="$("$prefix/bin/mkvmerge" --version | sed -n 1p)"
          echo "$first"
          case "$first" in
            "mkvmerge v$MKVTOOLNIX_VERSION "*) ;;
            *) echo "Homebrew installed $first, not the pinned MKVToolNix $MKVTOOLNIX_VERSION (P33)" >&2; exit 1 ;;
          esac
          {
            echo "LAZYMKV_TEST_MKVMERGE=$prefix/bin/mkvmerge"
            echo "LAZYMKV_TEST_FFPROBE=$prefix/bin/ffprobe"
            echo "LAZYMKV_TEST_FFMPEG=$prefix/bin/ffmpeg"
          } >> "$GITHUB_ENV"
          "$prefix/bin/ffmpeg" -version | sed -n 1p

      # Chocolatey's FFmpeg is above 7.0; MKVToolNix comes by its own installer, pinned by URL and SHA-256 and run
      # silently (call 20 over design part 12.1's package managers, T5-R49).
      - name: Install FFmpeg and MKVToolNix (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MKVTOOLNIX_URL: https://mkvtoolnix.download/windows/releases/103.0/mkvtoolnix-64-bit-103.0-setup.exe
          MKVTOOLNIX_SHA256: 3bb4b6efe464c8b852a9813f6be4093fa61bb79229ea755b3a70c5fa42489421
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install ffmpeg exited $LASTEXITCODE" }
          $setup = Join-Path $env:RUNNER_TEMP 'mkvtoolnix-setup.exe'
          Invoke-WebRequest -Uri $env:MKVTOOLNIX_URL -OutFile $setup
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:MKVTOOLNIX_SHA256) { throw "the MKVToolNix installer has SHA-256 $hash, not $env:MKVTOOLNIX_SHA256" }
          $install = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "the MKVToolNix installer exited $($install.ExitCode)" }
          $mkvmerge = Join-Path $env:ProgramFiles 'MKVToolNix\mkvmerge.exe'
          if (-not (Test-Path -LiteralPath $mkvmerge)) { throw "$mkvmerge is not there after the install" }
          & $mkvmerge --version
          $ffmpeg = (Get-Command ffmpeg.exe).Source
          $ffprobe = (Get-Command ffprobe.exe).Source
          & $ffmpeg -version | Select-Object -First 1
          "LAZYMKV_TEST_MKVMERGE=$mkvmerge" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LAZYMKV_TEST_FFPROBE=$ffprobe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LAZYMKV_TEST_FFMPEG=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # lazymkv-ocr (rten and ocrs) builds and runs on ubuntu only; macOS and Windows build and test the rest of the
      # workspace, and the mini PC builds the Windows worker (notes call 23, F1).
      - name: Build
        if: runner.os == 'Linux'
        run: cargo build --workspace --locked

      - name: Build (without lazymkv-ocr)
        if: runner.os != 'Linux'
        run: cargo build --workspace --exclude lazymkv-ocr --locked

      - name: Test
        if: runner.os == 'Linux'
        run: cargo test --workspace --locked

      # A2 and Ruling T5-R27: the ocr-trial feature links lazymkv-ocr, which only ubuntu builds (call 23), so its one
      # build and test run here, on this job's rten build (T5-R52).
      - name: Build lazymkv-dev with the ocr-trial feature (Linux)
        if: runner.os == 'Linux'
        run: cargo build -p lazymkv-dev --features ocr-trial --locked

      - name: Test the ocr-trial feature (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p lazymkv-dev --features ocr-trial --locked ocr_trial

      - name: Test (without lazymkv-ocr)
        if: runner.os != 'Linux'
        run: cargo test --workspace --exclude lazymkv-ocr --locked

      # Only lazymkv-ocr links rten: lazymkvctl carries the model bytes alone, the engine starts the worker process, and
      # lazymkv-dev links it only with --features ocr-trial (notes A2, E3, call 23; K1). cargo tree either reports that
      # rten matches no package in the package's graph or prints its inverse tree; neither may start a line with rten.
      - name: rten links only into lazymkv-ocr
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for package in lazymkv-ctl lazymkv-engine lazymkv-dev; do
            if out="$(cargo tree -p "$package" -e normal -i rten --locked 2>&1)"; then status=0; else status=$?; fi
            printf '%s\n' "$out"
            if printf '%s\n' "$out" | grep -q '^rten'; then
              echo "$package links rten; only lazymkv-ocr may (notes A2 and E3)" >&2
              exit 1
            fi
            if [ "$status" -ne 0 ] && ! printf '%s\n' "$out" | grep -q 'did not match any packages'; then
              echo "cargo tree failed for $package" >&2
              exit 1
            fi
          done

  guard:
    name: repository guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No evidence recording is tracked here
        run: |
          if git ls-files corpus/owner | grep -q .; then
            echo "corpus/owner is the private evidence repository; nothing under it may be tracked here" >&2
            git ls-files corpus/owner >&2
            exit 1
          fi

      - name: No token in the tree
        run: |
          if git grep -nE 'eyJhbGciOi[A-Za-z0-9_-]{20,}' -- . ':!.github/workflows/ci.yml'; then
            echo "a bearer token pattern is in the tree" >&2
            exit 1
          fi

  notices:
    # The notices of the crates lazymkvctl licenses prints (E1, call 26), generated by cargo-about from Cargo.lock
    # with about.toml and about.hbs. The job uploads the generated file as the artifact crate-notices, then fails when
    # it differs from crates/ctl/crate-notices.txt, so a dependency bump that changes the crate set or a licence is red
    # until that file is refreshed, by one commit of this artifact.
    name: crate notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          cargo --version

      - name: Install cargo-about
        run: cargo install cargo-about --version =0.9.2 --locked --features cli

      - name: Generate the crate notices
        run: |
          cargo about generate about.hbs -o crate-notices.txt
          git diff --exit-code Cargo.lock

      - name: Upload the generated notices
        uses: actions/upload-artifact@v4
        with:
          name: crate-notices
          path: crate-notices.txt
          if-no-files-found: error

      - name: Compare with the committed notices
        shell: bash
        run: |
          if ! diff -u crates/ctl/crate-notices.txt crate-notices.txt; then
            echo "::error::crates/ctl/crate-notices.txt differs from the generated notices; commit this run's artifact crate-notices as that file (call 26)"
            exit 1
          fi

name: CI

# Every push to main and every pull request builds and tests the workspace on Linux, macOS and Windows with the
# toolchain rust-toolchain.toml pins. The private evidence repository is not cloned here, so the tests that need it
# print their "skipped: ..." reason and the rest run (about 560 of them). ffmpeg is installed for the one test that
# builds its own proxy with lavfi; without it that test skips too.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

  guard:
    name: repository guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No evidence recording is tracked here
        run: |
          if git ls-files corpus/owner | grep -q .; then
            echo "corpus/owner is the private evidence repository; nothing under it may be tracked here" >&2
            git ls-files corpus/owner >&2
            exit 1
          fi

      - name: No token in the tree
        run: |
          if git grep -nE 'eyJhbGciOi[A-Za-z0-9_-]{20,}' -- . ':!.github/workflows/ci.yml'; then
            echo "a bearer token pattern is in the tree" >&2
            exit 1
          fi
